<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f6e8f0" />
  <title>Invitación | Revelación de Sexo</title>

  <style>
    :root{
      --W: 1024; /* ancho real de la imagen */
      --H: 1792; /* alto real de la imagen */
      --shadow: 0 20px 60px rgba(0,0,0,.25);
    }
    *{box-sizing:border-box}
    html,body{height:100%; margin:0}
    body{
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background:#f6eef3;
      display:flex;
      align-items:center;
      justify-content:center;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }

    /* ✅ Fullscreen real para móvil, estable en Safari/Chrome */
    .stage{
      position:relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh; /* navegadores modernos */
      max-width: 520px;  /* si quieres estilo “tarjeta” en desktop, deja esto */
      max-height: 940px; /* en móvil ocupará casi todo */
      border-radius: 22px;
      overflow:hidden;
      box-shadow: var(--shadow);
      background:#fff;
    }

    /* En móvil grande (S25 Ultra / iPhone 16 Pro Max) ocupa más */
    @media (min-width: 420px) and (min-height: 780px){
      .stage{ max-width: 560px; max-height: 980px; }
    }

    /* Imagen real (SIN recorte) */
    .bgImg{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit: contain;   /* CLAVE */
      object-position: center;
      background:#fff;
      user-select:none;
      -webkit-user-drag:none;
      pointer-events:none;
    }

    /* Overlay donde se colocan hotspots según el rect dibujado */
    .overlay{
      position:absolute;
      inset:0;
      z-index: 10;
      pointer-events:none;
    }

    .hotspot{
      position:absolute;
      border-radius:999px;
      background: rgba(255,255,255,0);
      border:0;
      padding:0;
      cursor:pointer;
      touch-action: manipulation;
      pointer-events:auto;
    }
    .hotspot:active{ transform: translateY(1px) scale(.995); }
    .hotspot[disabled]{ cursor:not-allowed; }

    /* brillo */
    .pulse{
      position:absolute;
      inset:-40%;
      background: radial-gradient(circle at var(--x,50%) var(--y,50%), rgba(255,255,255,.55), transparent 55%);
      opacity:0;
      pointer-events:none;
      transition: opacity .25s ease;
    }
    .hotspot.showPulse .pulse{ opacity:1; }

    /* ripple */
    .ripple{
      position:absolute;
      border-radius:999px;
      transform: scale(0);
      opacity:.40;
      animation: rip 520ms ease-out forwards;
      pointer-events:none;
      background: radial-gradient(circle, rgba(255,255,255,.65), transparent 65%);
    }
    @keyframes rip{ to{ transform: scale(1); opacity:0; } }

    /* Lluvia */
    .rainLayer{
      position:absolute; inset:0;
      z-index: 30;
      pointer-events:none;
      overflow:hidden;
    }
    .drop{
      position:absolute;
      top:-60px;
      animation: fall linear forwards;
      filter: drop-shadow(0 10px 12px rgba(0,0,0,.20));
      opacity:.98;
      will-change: transform;
    }
    @keyframes fall{
      to{ transform: translateY(calc(100% + 160px)) rotate(var(--rot)) scale(var(--sc)); opacity:1; }
    }

    /* Gate (solo inicio) */
    .gate{
      position:absolute; inset:0;
      z-index: 25;
      pointer-events:auto;
    }
    .gate.hidden{
      pointer-events:none;
      opacity:0;
      transition: opacity .35s ease;
    }

    /* ✅ Contador: pastillita (no atraviesa) */
    .countdownText{
      position:absolute;
      z-index: 20;
      pointer-events:none;
      user-select:none;

      font-weight: 900;
      letter-spacing:.2px;
      font-size: clamp(11px, 2.15vw, 18px);
      color: rgba(70,90,130,.95);
      text-shadow: 0 1px 0 rgba(255,255,255,.85), 0 10px 26px rgba(0,0,0,.12);

      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,.58);
      border: 1px solid rgba(255,255,255,.74);
      box-shadow: 0 12px 26px rgba(0,0,0,.10);

      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      text-align:center;
      white-space: nowrap;
    }

    /* Contador votos */
    .voteBox{
      position:absolute;
      z-index: 21;
      pointer-events:none;
      user-select:none;
      font-weight: 900;
      font-size: clamp(10px, 2vw, 16px);
      color: rgba(70,90,130,.95);
      text-shadow: 0 1px 0 rgba(255,255,255,.8), 0 6px 18px rgba(0,0,0,.10);
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:center;
      white-space: nowrap;
    }
    .voteBox span{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.45);
      border: 1px solid rgba(255,255,255,.6);
      box-shadow: 0 10px 24px rgba(0,0,0,.08);
    }

    .lockMsg{
      position:absolute;
      z-index:22;
      pointer-events:none;
      user-select:none;
      text-align:center;
      font-weight: 900;
      font-size: clamp(10px, 1.9vw, 14px);
      color: rgba(88,106,140,.92);
      text-shadow: 0 1px 0 rgba(255,255,255,.85), 0 6px 18px rgba(0,0,0,.10);
      opacity:0;
      transform: translateY(4px);
      transition: opacity .2s ease, transform .2s ease;
      background: rgba(255,255,255,.55);
      border: 1px solid rgba(255,255,255,.70);
      border-radius: 999px;
      padding: 7px 10px;
    }
    .lockMsg.show{ opacity:1; transform: translateY(0); }

    /* Modal regalos */
    .modal{
      position:absolute; inset:0;
      z-index: 50;
      background: rgba(0,0,0,.35);
      display:none;
      align-items:flex-end;
      justify-content:center;
      padding: 12px;
      backdrop-filter: blur(6px);
    }
    .modal.open{ display:flex; }
    .sheet{
      width: min(560px, 100%);
      background: rgba(255,255,255,.94);
      border-radius: 22px;
      padding: 14px 14px 12px;
      box-shadow: 0 30px 80px rgba(0,0,0,.25);
      color:#2b2b2b;
    }
    .sheet h3{ margin:0 0 6px; font-size:18px; }
    .sheet p{ margin:0 0 10px; font-size:13.5px; color:#4b4b4b; line-height:1.35; }
    .sheet ul{ margin:0; padding-left:18px; font-size:14px; line-height:1.5; }
    .sheet .close{
      margin-top:12px;
      width:100%;
      border:0;
      border-radius: 16px;
      padding: 12px;
      font-weight: 900;
      background: linear-gradient(180deg, #ffd3e8, #ffe9f4);
      cursor:pointer;
    }
  </style>
</head>

<body>
  <div class="stage" id="stage">
    <img class="bgImg" id="bgImg" src="fondo-ositos.png" alt="Invitación" />

    <div class="rainLayer" id="rainLayer"></div>

    <div class="countdownText" id="countdownText">⏳ Faltan -- días --h --m --s</div>

    <div class="voteBox" id="voteBox" aria-hidden="true">
      <span>💙 Boy: <b id="boyCount">0</b></span>
      <span>💗 Girl: <b id="girlCount">0</b></span>
    </div>

    <div class="lockMsg" id="lockMsg">✅ Voto registrado. Ya no puedes cambiar de team.</div>

    <div class="overlay" id="overlay">
      <div class="gate" id="gate">
        <button class="hotspot" id="openInvite" aria-label="Abrir invitación"><span class="pulse"></span></button>
      </div>

      <button class="hotspot" id="btnBoy" aria-label="Team Boy"><span class="pulse"></span></button>
      <button class="hotspot" id="btnGirl" aria-label="Team Girl"><span class="pulse"></span></button>
      <button class="hotspot" id="btnMaps" aria-label="Cómo llegar"><span class="pulse"></span></button>
      <button class="hotspot" id="btnRsvp" aria-label="Confirmar asistencia"><span class="pulse"></span></button>
      <button class="hotspot" id="giftHotspot" aria-label="Ver ideas de regalos"><span class="pulse"></span></button>
    </div>

    <div class="modal" id="modal">
      <div class="sheet" role="dialog" aria-modal="true" aria-label="Ideas de regalos">
        <h3>🎁 Ideas de regalos</h3>
        <p>
          Si deseas llevar un detalle, te pedimos que sea <b>unisex</b> 💛:
          ropa en <b>colores universales</b> y <b>juegos/juguetes</b> que sirvan para ambos
          (evitar muñecas u objetos “solo niña/solo niño”).
        </p>
        <ul id="giftList"></ul>
        <button class="close" id="closeModal">Cerrar ✨</button>
      </div>
    </div>
  </div>

  <script>
    /**********************
     * CONFIG
     **********************/
    const EVENT_DATE = "2026-03-07T15:00:00";

    const RSVP_PHONE = "+16294628232";
    const RSVP_MESSAGE = "Hola! ✅ Confirmo mi asistencia a la revelación de sexo. ¿A qué hora debo llegar?";
    const MAPS_URL = "https://www.google.com/maps/search/?api=1&query=Ubicaci%C3%B3n%20del%20evento";

    // ✅ Regalos (unisex + colores universales + juguetes para ambos)
    const GIFTS = [
      "👕 Ropita UNISEX en colores universales: blanco, crema, beige, gris, verde menta o amarillo suave",
      "🧦 Medias/mitones unisex en tonos neutros",
      "🧢 Gorritos, baberos o pañitos en colores neutrales",
      "🧸 Juguetes sensoriales para bebé (mordederas, sonajeros suaves, libros de tela) para ambos",
      "🎲 Juegos para bebé (apilables, encajables, gimnasios de actividades) neutros",
      "🧼 Artículos de cuidado (toallitas, shampoo, crema) que sirven para cualquier bebé",
      "🧺 Mantas o muselinas en tonos neutrales"
    ];

    /**********************
     * ✅ VOTOS (local por dispositivo)
     **********************/
    const KEY_COUNTS = "inv_votes_counts_v1";
    const KEY_CHOICE = "inv_votes_choice_v1";

    function loadCounts(){
      try{
        const raw = localStorage.getItem(KEY_COUNTS);
        if(!raw) return {boy:0, girl:0};
        const o = JSON.parse(raw);
        return { boy: Number(o.boy||0), girl: Number(o.girl||0) };
      }catch(e){ return {boy:0, girl:0}; }
    }
    function saveCounts(c){ localStorage.setItem(KEY_COUNTS, JSON.stringify(c)); }
    function setCountsUI(c){
      document.getElementById("boyCount").textContent = c.boy;
      document.getElementById("girlCount").textContent = c.girl;
    }
    function getChoice(){ return localStorage.getItem(KEY_CHOICE); }
    function setChoice(choice){ localStorage.setItem(KEY_CHOICE, choice); }

    function lockSelectionUI(choice){
      const boy = document.getElementById("btnBoy");
      const girl = document.getElementById("btnGirl");
      const msg = document.getElementById("lockMsg");
      boy.disabled = true;
      girl.disabled = true;
      msg.classList.add("show");
      if(choice === "boy") spawnRain("boy");
      if(choice === "girl") spawnRain("girl");
    }

    /**********************
     * AUDIO click (iPhone/Android)
     **********************/
    let audioUnlocked = false;
    let audioCtx = null;

    function unlockAudio(){
      if (audioUnlocked) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      g.gain.value = 0.0001;
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + 0.01);
      audioUnlocked = true;
    }
    function clickSound(){
      if (!audioUnlocked || !audioCtx) return;
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = "sine";
      o.frequency.setValueAtTime(880, audioCtx.currentTime);
      g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.18, audioCtx.currentTime + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.12);
      o.connect(g); g.connect(audioCtx.destination);
      o.start();
      o.stop(audioCtx.currentTime + 0.13);
    }

    /**********************
     * FX
     **********************/
    function glow(el, ev){
      const rect = el.getBoundingClientRect();
      const x = ((ev.clientX ?? (rect.left+rect.width/2)) - rect.left) / rect.width * 100;
      const y = ((ev.clientY ?? (rect.top+rect.height/2)) - rect.top) / rect.height * 100;
      el.style.setProperty("--x", x + "%");
      el.style.setProperty("--y", y + "%");
      el.classList.add("showPulse");
      setTimeout(()=> el.classList.remove("showPulse"), 220);
    }
    function ripple(el, ev){
      const rect = el.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height) * 1.8;
      const r = document.createElement("span");
      r.className = "ripple";
      r.style.width = r.style.height = size + "px";
      const x = (ev.clientX - rect.left) - size/2;
      const y = (ev.clientY - rect.top) - size/2;
      r.style.left = x + "px";
      r.style.top  = y + "px";
      el.appendChild(r);
      setTimeout(()=> r.remove(), 560);
    }
    function bindTap(el, handler){
      el.addEventListener("click", (ev)=>{
        unlockAudio(); clickSound();
        glow(el, ev); ripple(el, ev);
        handler(ev);
      }, {passive:true});
    }

    /**********************
     * Rain
     **********************/
    const rainLayer = document.getElementById("rainLayer");
    function spawnRain(type){
      const count = 48;
      for(let i=0;i<count;i++){
        const d = document.createElement("div");
        d.className = "drop";
        const left = Math.random()*100;
        const dur  = 2.1 + Math.random()*1.9;
        const delay= Math.random()*0.28;
        const sc   = 0.75 + Math.random()*1.25;
        const rot  = (Math.random()*160 - 80).toFixed(1) + "deg";
        d.style.left = left + "%";
        d.style.animationDuration = dur + "s";
        d.style.animationDelay = delay + "s";
        d.style.setProperty("--rot", rot);
        d.style.setProperty("--sc", sc);
        d.style.fontSize = (18 + Math.random()*18).toFixed(0) + "px";
        d.textContent = (type === "boy")
          ? (Math.random() > 0.25 ? "🎈" : "💙")
          : (Math.random() > 0.25 ? "💖" : "💗");
        rainLayer.appendChild(d);
        setTimeout(()=> d.remove(), (dur + delay + 0.6)*1000);
      }
    }

    /**********************
     * Actions
     **********************/
    function openMaps(){ window.open(MAPS_URL, "_blank"); }
    function openWhatsApp(){
      const phone = RSVP_PHONE.replace(/[^\d]/g,"");
      const text = encodeURIComponent(RSVP_MESSAGE);
      window.open(`https://wa.me/${phone}?text=${text}`, "_blank");
    }

    /**********************
     * Countdown realtime
     **********************/
    const countdownText = document.getElementById("countdownText");
    function startCountdown(){
      const target = new Date(EVENT_DATE).getTime();
      const tick = () => {
        const now = Date.now();
        let diff = Math.max(0, target - now);
        const days = Math.floor(diff / (1000*60*60*24)); diff -= days*(1000*60*60*24);
        const hrs  = Math.floor(diff / (1000*60*60));    diff -= hrs*(1000*60*60);
        const mins = Math.floor(diff / (1000*60));       diff -= mins*(1000*60);
        const secs = Math.floor(diff / 1000);
        countdownText.textContent = `⏳ Faltan ${days} días ${hrs}h ${mins}m ${secs}s`;
      };
      tick();
      setInterval(tick, 1000);
    }

    /**********************
     * Modal gifts
     **********************/
    const modal = document.getElementById("modal");
    const giftList = document.getElementById("giftList");
    function openGifts(){ unlockAudio(); clickSound(); modal.classList.add("open"); }
    function closeGifts(){ unlockAudio(); clickSound(); modal.classList.remove("open"); }

    /**********************
     * Vote
     **********************/
    function vote(choice){
      if(getChoice()) return;
      const counts = loadCounts();
      if(choice === "boy") counts.boy += 1;
      if(choice === "girl") counts.girl += 1;
      saveCounts(counts);
      setCountsUI(counts);
      setChoice(choice);
      spawnRain(choice);
      lockSelectionUI(choice);
    }

    /**********************
     * ✅ POSICIONAMIENTO PERFECTO (iPhone 16+ / S25 Ultra)
     **********************/
    const W = 1024, H = 1792;

    // Rects en coordenadas de la imagen (x,y,w,h) usando proporciones del diseño
    const RECTS = {
      openInvite:  { x: 0.16*W,  y: 0.109*H, w: 0.68*W,  h: 0.069*H },

      btnBoy:      { x: 0.245*W, y: 0.747*H, w: 0.255*W, h: 0.047*H },
      btnGirl:     { x: 0.505*W, y: 0.747*H, w: 0.255*W, h: 0.047*H },

      btnMaps:     { x: 0.245*W, y: 0.796*H, w: 0.255*W, h: 0.047*H },
      btnRsvp:     { x: 0.505*W, y: 0.796*H, w: 0.255*W, h: 0.047*H },

      giftHotspot: { x: 0.22*W,  y: 0.822*H, w: 0.56*W,  h: 0.058*H },

      // ✅ Contador movido para NO molestar: un poquito más abajo y centrado
      countdownText:{ x: 0.18*W, y: 0.712*H, w: 0.64*W,  h: 0.040*H },

      voteBox:     { x: 0.205*W,y: 0.728*H, w: 0.59*W,  h: 0.034*H },
      lockMsg:     { x: 0.16*W, y: 0.781*H, w: 0.68*W,  h: 0.035*H },
    };

    function computeDrawRect(){
      const stage = document.getElementById("stage");
      const s = stage.getBoundingClientRect();

      // ✅ Ajuste por visualViewport (Safari cambia alto visible)
      const vv = window.visualViewport;
      // no usamos vv.offsetTop para mover stage; solo recalculamos rápido en cada cambio
      const stageW = s.width;
      const stageH = s.height;

      const imgRatio = W / H;
      const stageRatio = stageW / stageH;

      let drawW, drawH, offsetX, offsetY;

      if(stageRatio > imgRatio){
        drawH = stageH;
        drawW = drawH * imgRatio;
        offsetX = (stageW - drawW)/2;
        offsetY = 0;
      } else {
        drawW = stageW;
        drawH = drawW / imgRatio;
        offsetX = 0;
        offsetY = (stageH - drawH)/2;
      }

      return { x: offsetX, y: offsetY, w: drawW, h: drawH };
    }

    function placeRect(el, r, drawRect){
      const scaleX = drawRect.w / W;
      const scaleY = drawRect.h / H;

      el.style.left = (drawRect.x + r.x * scaleX) + "px";
      el.style.top  = (drawRect.y + r.y * scaleY) + "px";
      el.style.width  = (r.w * scaleX) + "px";
      el.style.height = (r.h * scaleY) + "px";
    }

    function positionAll(){
      const drawRect = computeDrawRect();

      placeRect(document.getElementById("openInvite"), RECTS.openInvite, drawRect);
      placeRect(document.getElementById("btnBoy"),     RECTS.btnBoy,     drawRect);
      placeRect(document.getElementById("btnGirl"),    RECTS.btnGirl,    drawRect);
      placeRect(document.getElementById("btnMaps"),    RECTS.btnMaps,    drawRect);
      placeRect(document.getElementById("btnRsvp"),    RECTS.btnRsvp,    drawRect);
      placeRect(document.getElementById("giftHotspot"),RECTS.giftHotspot,drawRect);

      placeRect(document.getElementById("countdownText"), RECTS.countdownText, drawRect);
      placeRect(document.getElementById("voteBox"),       RECTS.voteBox,       drawRect);
      placeRect(document.getElementById("lockMsg"),       RECTS.lockMsg,       drawRect);
    }

    // Gate open
    const gate = document.getElementById("gate");
    function openInvitation(){
      gate.classList.add("hidden");
      spawnRain("girl"); setTimeout(()=> spawnRain("boy"), 220);
    }

    // Reflow helper (para Safari cuando barra sube/baja)
    let raf = 0;
    function scheduleReflow(){
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(positionAll);
    }

    /**********************
     * INIT
     **********************/
    window.addEventListener("DOMContentLoaded", ()=>{
      // regalos
      giftList.innerHTML = "";
      GIFTS.forEach(g=>{ const li=document.createElement("li"); li.textContent=g; giftList.appendChild(li); });

      // votos init
      const counts = loadCounts();
      setCountsUI(counts);
      const choice = getChoice();
      if(choice) lockSelectionUI(choice);

      // contador
      startCountdown();

      // posiciones perfectas
      const img = document.getElementById("bgImg");
      if(img.complete) positionAll();
      img.addEventListener("load", positionAll);

      // ✅ clave para iPhone/Safari
      window.addEventListener("resize", scheduleReflow);
      window.addEventListener("orientationchange", scheduleReflow);
      if(window.visualViewport){
        window.visualViewport.addEventListener("resize", scheduleReflow);
        window.visualViewport.addEventListener("scroll", scheduleReflow);
      }

      // binds
      bindTap(document.getElementById("openInvite"), openInvitation);
      bindTap(document.getElementById("btnBoy"),  ()=> vote("boy"));
      bindTap(document.getElementById("btnGirl"), ()=> vote("girl"));
      bindTap(document.getElementById("btnMaps"), openMaps);
      bindTap(document.getElementById("btnRsvp"), openWhatsApp);

      document.getElementById("giftHotspot").addEventListener("click", openGifts, {passive:true});
      document.getElementById("closeModal").addEventListener("click", closeGifts, {passive:true});
      modal.addEventListener("click", (e)=>{ if(e.target === modal) closeGifts(); }, {passive:true});
    });
  </script>
</body>
</html>
